name: Temporary Beetle Saturn Android arm64 current master retest
on:
  push:
    branches:
      - build/current-master-arm64-retest-20261012-01
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact upstream master source
        uses: actions/checkout@v4
        with:
          ref: a57e0f72b47a649298790202f9580bd3d9563d1f
      - name: Verify source revision and cleanliness
        env:
          SOURCE_SHA: a57e0f72b47a649298790202f9580bd3d9563d1f
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --short --branch
          git diff --check
          git diff --stat
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018
      - name: Build arm64-v8a core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cd jni
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            -j2
          file libs/arm64-v8a/libretro.so
          cd ..
          git diff --check
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: beetle-saturn-android-arm64-current-master-a57e0f7
          path: jni/libs/arm64-v8a/libretro.so
          if-no-files-found: error